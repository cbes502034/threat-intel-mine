<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threat Intel · 資安知識問答</title>
  <style>
    :root {
      --bg: #0a0d10;
      --panel: #10151a;
      --line: #1f2a33;
      --line2: #2b3a46;
      --text: #f1f5f8;
      --sub: #8a98a5;
      --dim: #5d6b77;
      --acc: #0ABAB5;
      --acc-h: #2BFFE0;
      --high: #ff5d5d;
      --med: #ffb020;
      --low: #3ddc97;
      --mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
      --sans: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    * {
      box-sizing: border-box;
      border-radius: 0 !important
    }

    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.6 var(--sans);
      background-image:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: 32px 32px;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
      color: inherit
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px
    }

    /* 頂欄 */
    header {
      border-bottom: 1px solid var(--line);
      background: rgba(10, 13, 16, .92);
      position: sticky;
      top: 0;
      z-index: 5
    }

    header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px
    }

    .brand {
      font-family: var(--mono);
      font-weight: 700;
      letter-spacing: .08em;
      font-size: 15px
    }

    .brand b {
      color: var(--acc)
    }

    .status {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--sub);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--dim);
      display: inline-block
    }

    .dot.ok {
      background: var(--low)
    }

    .dot.off {
      background: var(--high)
    }

    /* 提問列 */
    .query {
      padding: 36px 0 24px
    }

    .query h1 {
      font-size: 13px;
      font-family: var(--mono);
      color: var(--sub);
      font-weight: 400;
      margin: 0 0 10px;
      letter-spacing: .1em
    }

    .qrow {
      display: flex;
      gap: 0;
      border: 1px solid var(--line2);
      background: var(--panel)
    }

    .qrow:focus-within {
      border-color: var(--acc)
    }

    .qrow input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: 0;
      padding: 16px 18px;
      font: 18px var(--sans)
    }

    .qrow input::placeholder {
      color: var(--dim)
    }

    .btn {
      background: var(--acc);
      color: #04201f;
      border: 0;
      padding: 0 28px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .06em
    }

    .btn:hover:not(:disabled) {
      background: var(--acc-h)
    }

    .btn:disabled {
      background: var(--line2);
      color: var(--dim);
      cursor: not-allowed
    }

    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: var(--sub);
      min-height: 20px
    }

    .hint.err {
      color: var(--high)
    }

    /* 主版面 */
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 20px;
      padding-bottom: 60px;
      align-items: start
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line)
    }

    .card>h2 {
      margin: 0;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      font: 600 12px var(--mono);
      letter-spacing: .12em;
      color: var(--sub);
      text-transform: uppercase
    }

    .empty {
      padding: 60px 16px;
      text-align: center;
      color: var(--dim);
      font-family: var(--mono);
      font-size: 13px
    }

    .loading {
      padding: 40px 16px
    }

    .loading .t {
      font-family: var(--mono);
      color: var(--sub);
      font-size: 13px;
      margin-bottom: 12px
    }

    .bar {
      height: 4px;
      background: var(--line);
      position: relative;
      overflow: hidden
    }

    .bar::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 30%;
      background: var(--acc);
      animation: run 1.4s linear infinite
    }

    @keyframes run {
      from {
        left: -30%
      }

      to {
        left: 100%
      }
    }

    .q {
      padding: 16px;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.5;
      word-break: break-word
    }

    .kmeta {
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      font: 12px var(--mono);
      letter-spacing: .1em;
      color: var(--dim)
    }

    /* 回答 */
    .ans {
      padding: 16px;
      border-top: 1px solid var(--line);
      font-size: 16px;
      line-height: 1.85;
      word-break: break-word
    }

    .ans p {
      margin: 0 0 10px
    }

    .ans ul,
    .ans ol {
      margin: 0 0 10px;
      padding-left: 22px
    }

    .ans li {
      margin: 4px 0
    }

    .ans strong {
      color: var(--text);
      font-weight: 700
    }

    .ans code {
      font: 13px var(--mono);
      background: #0b1015;
      border: 1px solid var(--line2);
      padding: 1px 6px;
      word-break: break-all
    }

    .cite {
      font: 700 12px var(--mono);
      color: var(--acc);
      background: transparent;
      border: 1px solid var(--acc);
      padding: 0 6px;
      margin: 0 2px;
      cursor: pointer;
      vertical-align: 1px
    }

    .cite:hover {
      color: var(--acc-h);
      border-color: var(--acc-h)
    }

    /* 逐字顯示：游標與來源區淡入 */
    .caret {
      display: inline-block;
      width: 8px;
      height: 1.05em;
      margin-left: 2px;
      background: var(--acc);
      vertical-align: -3px;
      animation: blink 1s steps(2, start) infinite
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    .srcbox {
      opacity: 0;
      transition: opacity .4s
    }

    .srcbox.show {
      opacity: 1
    }

    @media (prefers-reduced-motion: reduce) {
      .srcbox {
        transition: none
      }

      .caret {
        animation: none
      }
    }

    /* 引用來源 */
    .srcs {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .si {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      transition: background .3s
    }

    .si.flash {
      background: #12302f
    }

    .si .rank {
      font: 800 18px var(--mono);
      color: var(--acc);
      flex: none
    }

    .si .ttl {
      font: 600 14px var(--mono);
      flex: 1;
      min-width: 0;
      word-break: break-word
    }

    .si .cid {
      font: 11px var(--mono);
      color: var(--dim);
      white-space: nowrap
    }

    /* 知識來源 */
    .kb {
      list-style: none;
      margin: 0;
      padding: 0
    }

    .kb li {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line)
    }

    .kb .nm {
      font: 600 13px var(--mono);
      color: var(--acc)
    }

    .kb .ds {
      margin-top: 2px;
      font-size: 14px;
      color: var(--sub)
    }

    .note {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--dim)
    }

    @media(max-width:860px) {
      .grid {
        grid-template-columns: minmax(0, 1fr)
      }

      .qrow {
        flex-direction: column
      }

      .btn {
        padding: 14px
      }

      .qrow input {
        font-size: 16px
      }

      .ans {
        font-size: 15px
      }

      .q {
        font-size: 17px
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="brand">THREAT<b>/</b>INTEL</div>
      <div class="status"><span class="dot" id="dot"></span><span id="stxt">連線中</span></div>
    </div>
  </header>

  <main class="wrap">
    <section class="query">
      <h1>SECURITY KNOWLEDGE · 資安知識問答</h1>
      <form class="qrow" id="form" autocomplete="off">
        <input id="question" placeholder="問一個資安問題，例如：怎麼防止子網域接管？" maxlength="500" autofocus>
        <button class="btn" id="go" type="submit">提問</button>
      </form>
      <div class="hint" id="hint"></div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>回答</h2>
        <div id="body">
          <div class="empty">輸入問題開始提問</div>
        </div>
      </section>

      <aside class="card">
        <h2>知識來源</h2>
        <ul class="kb">
          <li><div class="nm">MITRE ATT&amp;CK</div><div class="ds">攻擊手法（偵察、資源開發、初始入侵、C2）與緩解措施</div></li>
          <li><div class="nm">OWASP Cheat Sheet</div><div class="ds">子網域接管防護</div></li>
          <li><div class="nm">Cloudflare Docs</div><div class="ds">DNS 與代理的運作、來源伺服器保護</div></li>
        </ul>
        <div class="note">回答只根據檢索到的資料；資料中沒有的內容會明說。</div>
      </aside>
    </div>
  </main>

  <script>
    const API = "/api";
    let busy = false;

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    /* ---------- API ---------- */
    async function api(path, opt) {
      let r;
      try { r = await fetch(API + path, opt); }
      catch { throw new Error("連不到後端，請確認伺服器已啟動，並從 http://localhost:8000 開啟本頁"); }
      if (!r.ok) { const d = (await r.json().catch(() => ({}))).detail; throw new Error(typeof d === "string" ? d : ("HTTP " + r.status)); }
      return r.json();
    }

    /* ---------- 回答 ---------- */
    /* 把 Claude 回的簡易 Markdown（粗體、行內程式碼、清單）轉成畫面；先跳脫再轉換，所以不會執行回傳內容裡的 HTML。
       答案裡的 [1] 這種編號，只有在 sources 真的有這個 ref 時才變成可點的標籤。 */
    function renderAnswer(text, refs) {
      const inline = s => s
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\[(\d{1,2})\]/g, (m, n) => refs.has(+n) ? `<button type="button" class="cite" data-ref="${n}">${n}</button>` : m);
      let out = "", list = null;
      const close = () => { if (list) { out += `</${list}>`; list = null; } };
      for (const raw of esc(text).split("\n")) {
        const line = raw.trim(); let m;
        if (!line) { close(); continue; }
        if ((m = line.match(/^[-*]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; }
        else if ((m = line.match(/^\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; }
        else { close(); out += `<p>${inline(line)}</p>`; }
      }
      close(); return out;
    }
    /* 逐字顯示（純前端效果，答案其實已經完整收到）：
       先把完整答案渲染好，再把每個文字節點清空、依序補回去，所以粗體、清單、程式碼不會在打字中途閃爍。
       [1] 這種引用標籤整個一次出現；點答案區、或使用者減少動態效果時，會直接顯示全文。 */
    let typer = null;
    function typeIn(el, onDone) {
      const items = [], w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      for (let n; (n = w.nextNode());) {
        if (!n.data) continue;
        items.push({ n, full: n.data, pos: 0, atomic: !!n.parentElement.closest(".cite") });
      }
      const total = items.reduce((s, o) => s + (o.atomic ? 1 : o.full.length), 0);
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!total || reduced) { onDone(); return null; }
      items.forEach(o => { o.n.data = ""; });
      const caret = document.createElement("span"); caret.className = "caret";
      const ms = Math.min(3500, Math.max(600, total * 12));          // 全文約 0.6~3.5 秒打完，長答案不會拖太久
      const step = Math.max(1, Math.ceil(total / (ms / 25)));        // 每 25ms 補回 step 個字
      let i = 0, timer = null;
      const finish = () => {
        clearInterval(timer); el.removeEventListener("click", finish);
        items.forEach(o => { o.n.data = o.full; });
        caret.remove(); typer = null; onDone();
      };
      timer = setInterval(() => {
        let budget = step;
        while (budget > 0 && i < items.length) {
          const o = items[i];
          if (o.atomic) { o.n.data = o.full; i++; budget--; continue; }
          const take = Math.min(o.full.length - o.pos, budget);
          o.pos += take; budget -= take; o.n.data = o.full.slice(0, o.pos);
          if (o.pos >= o.full.length) i++;
        }
        if (i >= items.length) return finish();
        const cur = items[i].n; (cur.parentElement.closest(".cite") || cur).after(caret);
      }, 25);
      el.addEventListener("click", finish);
      return { cancel() { clearInterval(timer); el.removeEventListener("click", finish); typer = null; } };
    }
    function showAnswer(res) {
      const src = res.sources || [];
      $("body").innerHTML = `<div class="q">${esc(res.question)}</div>` +
        `<div class="kmeta">回答</div><div class="ans">${renderAnswer(res.answer || "", new Set(src.map(s => s.ref)))}</div>` +
        (src.length ? `<div class="srcbox" id="srcbox"><div class="kmeta">引用來源 · ${src.length} 塊檢索資料</div><ol class="srcs">` + src.map(s =>
          `<li class="si" id="src-${esc(s.ref)}"><span class="rank">${esc(s.ref)}</span><span class="ttl">${esc(s.title)}</span><span class="cid">#${esc(s.id)}</span></li>`).join("") + `</ol></div>` : "");
      typer = typeIn($("body").querySelector(".ans"), () => { const b = $("srcbox"); if (b) b.classList.add("show"); });
    }
    function setHint(msg, err) { const h = $("hint"); h.textContent = msg || ""; h.className = "hint" + (err ? " err" : ""); }

    /* ---------- 事件 ---------- */
    $("form").addEventListener("submit", async ev => {
      ev.preventDefault();
      if (busy) return;
      const q = $("question").value.trim();
      if (!q) return setHint("請輸入問題", true);
      if (typer) typer.cancel();                       // 上一題還在逐字顯示時，直接中止
      setHint(""); busy = true; $("go").disabled = true;
      const t0 = Date.now();
      $("body").innerHTML = `<div class="loading"><div class="t" id="lt">生成中… 0 秒</div><div class="bar"></div></div>`;
      const timer = setInterval(() => { const e = $("lt"); if (e) e.textContent = `生成中… ${Math.floor((Date.now() - t0) / 1000)} 秒`; }, 500);
      try {
        showAnswer(await api("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) }));
      } catch (e) {
        $("body").innerHTML = `<div class="empty">生成失敗：${esc(e.message)}</div>`;
      } finally { clearInterval(timer); busy = false; $("go").disabled = false; }
    });
    $("body").addEventListener("click", ev => {
      const c = ev.target.closest(".cite"); if (!c) return;
      const li = $("src-" + c.dataset.ref); if (!li) return;
      li.scrollIntoView({ behavior: "smooth", block: "nearest" });
      li.classList.add("flash"); setTimeout(() => li.classList.remove("flash"), 1200);
    });

    /* ---------- 啟動：探測後端 ---------- */
    (async function () {
      try {
        const r = await fetch(API + "/health", { cache: "no-store" });
        if (!r.ok) throw 0;
        $("dot").className = "dot ok"; $("stxt").textContent = "ONLINE";
      } catch {
        $("dot").className = "dot off"; $("stxt").textContent = "OFFLINE";
      }
    })();
  </script>
</body>

</html>
